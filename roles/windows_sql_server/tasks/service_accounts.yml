---
- name: assert SQL service account settings are present when managed
  ansible.builtin.assert:
    that:
      - windows_sql_server.service_accounts.sqlsvc.sam_account_name is defined
      - windows_sql_server.service_accounts.sqlsvc.password is defined
      - windows_sql_server.service_accounts.agtsvc.sam_account_name is defined
      - windows_sql_server.service_accounts.agtsvc.password is defined
    fail_msg: >-
      windows_sql_server.service_accounts must define sqlsvc and agtsvc
      sam_account_name values and passwords when manage=true.
  when: windows_sql_server.service_accounts.manage

- name: ensure Active Directory PowerShell tools are present on the domain controller
  ansible.windows.win_feature:
    name: RSAT-AD-PowerShell
    state: present
  delegate_to: "{{ domain.controller_host }}"
  when: windows_sql_server.service_accounts.manage

- name: validate Active Directory cmdlets are available on the domain controller
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'

      if (-not (Get-Command -Name Get-ADRootDSE -ErrorAction SilentlyContinue)) {
        throw 'Get-ADRootDSE is not available on the domain controller'
      }
  delegate_to: "{{ domain.controller_host }}"
  changed_when: false
  when: windows_sql_server.service_accounts.manage

- name: ensure SQL Server Database Engine service account exists
  microsoft.ad.user:
    identity: "{{ windows_sql_server.service_accounts.sqlsvc.sam_account_name }}"
    name: "{{ windows_sql_server.service_accounts.sqlsvc.sam_account_name }}"
    password: "{{ windows_sql_server.service_accounts.sqlsvc.password }}"
    domain_server: "{{ domain.controller_host }}.{{ domain.name }}"
    domain_username: "{{ domain.admin.upn }}"
    domain_password: "{{ domain.admin.password }}"
    password_never_expires: true
    update_password: when_changed
    description: "{{ windows_sql_server.service_accounts.sqlsvc.description }}"
    enabled: true
    state: present
  delegate_to: "{{ domain.controller_host }}"
  register: windows_sql_server_sqlsvc_user
  retries: 10
  delay: 15
  until: windows_sql_server_sqlsvc_user is successful
  run_once: true
  when: windows_sql_server.service_accounts.manage

- name: ensure SQL Server Agent service account exists
  microsoft.ad.user:
    identity: "{{ windows_sql_server.service_accounts.agtsvc.sam_account_name }}"
    name: "{{ windows_sql_server.service_accounts.agtsvc.sam_account_name }}"
    password: "{{ windows_sql_server.service_accounts.agtsvc.password }}"
    domain_server: "{{ domain.controller_host }}.{{ domain.name }}"
    domain_username: "{{ domain.admin.upn }}"
    domain_password: "{{ domain.admin.password }}"
    password_never_expires: true
    update_password: when_changed
    description: "{{ windows_sql_server.service_accounts.agtsvc.description }}"
    enabled: true
    state: present
  delegate_to: "{{ domain.controller_host }}"
  register: windows_sql_server_agtsvc_user
  retries: 10
  delay: 15
  until: windows_sql_server_agtsvc_user is successful
  run_once: true
  when: windows_sql_server.service_accounts.manage

- name: set managed SQL Server service account facts
  ansible.builtin.set_fact:
    windows_sql_server_sqlsvc_account_effective: >-
      {{ domain.netbios_name }}\{{ windows_sql_server.service_accounts.sqlsvc.sam_account_name }}
    windows_sql_server_sqlsvc_password_effective: "{{ windows_sql_server.service_accounts.sqlsvc.password }}"
    windows_sql_server_agtsvc_account_effective: >-
      {{ domain.netbios_name }}\{{ windows_sql_server.service_accounts.agtsvc.sam_account_name }}
    windows_sql_server_agtsvc_password_effective: "{{ windows_sql_server.service_accounts.agtsvc.password }}"
  when: windows_sql_server.service_accounts.manage
