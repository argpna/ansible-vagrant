---
- name: inspect the SQL Server instance state
  win_sql_server_instance_info:
    instance_name: "{{ windows_sql_server.instance_name }}"
  register: windows_sql_server_instance
  changed_when: false

- name: uninstall SQL Server when the instance exists
  when: windows_sql_server_instance.exists
  block:
    - name: require an ISO image for the removal
      ansible.builtin.assert:
        that:
          - windows_sql_server.media_iso_path | default('', true) | length > 0
        fail_msg: >-
          windows_sql_server.media_iso_path is required to remove SQL Server from
          {{ inventory_hostname }}.

    - name: mount the SQL Server ISO
      community.windows.win_disk_image:
        image_path: "{{ windows_sql_server.media_iso_path }}"
        state: present
      register: windows_sql_server_iso_mount

    - name: uninstall SQL Server with setup.exe
      ansible.windows.win_command:
        argv:
          - "{{ windows_sql_server_iso_mount.mount_paths[0] }}setup.exe"
          - /Q
          - /IACCEPTSQLSERVERLICENSETERMS
          - /ACTION=Uninstall
          - "/FEATURES={{ windows_sql_server.features | join(',') | upper }}"
          - "/INSTANCENAME={{ windows_sql_server.instance_name }}"
      register: windows_sql_server_uninstall
      failed_when: windows_sql_server_uninstall.rc not in [0, 3010]
      become: true
      become_method: ansible.builtin.runas
      vars:
        ansible_become_user: System

  always:
    - name: dismount the SQL Server ISO
      community.windows.win_disk_image:
        image_path: "{{ windows_sql_server.media_iso_path }}"
        state: absent
      when: windows_sql_server.media_iso_path | default('', true) | length > 0

- name: remove the SQL Server firewall rule
  community.windows.win_firewall_rule:
    name: "SQL Server {{ windows_sql_server.tcp_port | default(1433) }}"
    state: absent
  when: windows_sql_server.manage_firewall | default(false)

- name: clear any pending reboot
  ansible.builtin.include_tasks: reboot_pending.yml
