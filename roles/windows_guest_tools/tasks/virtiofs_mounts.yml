---
- name: Ensure virtiofs state directory exists
  ansible.windows.win_file:
    path: "{{ windows_guest_tools_state_dir }}"
    state: directory

- name: Validate host share mount records
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.tag is defined
      - item.tag | length > 0
      - item.guest is defined
      - item.guest is mapping
      - item.guest.drive is defined
      - item.guest.drive is match('^[A-Z]:$')
    fail_msg: "Invalid windows_extras.host_shares entry: {{ item }}"
  loop: "{{ windows_extras.host_shares }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Check for WinFSP fsreg helper
  ansible.windows.win_stat:
    path: "{{ windows_guest_tools_winfsp_fsreg_path }}"
  register: windows_guest_tools_winfsp_fsreg_stat

- name: Check for WinFSP launchctl helper
  ansible.windows.win_stat:
    path: "{{ windows_guest_tools_winfsp_launchctl_path }}"
  register: windows_guest_tools_winfsp_launchctl_stat

- name: Check for virtiofs executable
  ansible.windows.win_stat:
    path: "{{ windows_guest_tools_virtiofs_exe_path }}"
  register: windows_guest_tools_virtiofs_exe_stat

- name: Require WinFSP and virtiofs helpers to exist
  ansible.builtin.assert:
    that:
      - windows_guest_tools_winfsp_fsreg_stat.stat.exists
      - windows_guest_tools_winfsp_launchctl_stat.stat.exists
      - windows_guest_tools_virtiofs_exe_stat.stat.exists
    fail_msg: >-
      Missing one or more virtiofs helper binaries.
      Expected:
      {{ windows_guest_tools_winfsp_fsreg_path }},
      {{ windows_guest_tools_winfsp_launchctl_path }},
      {{ windows_guest_tools_virtiofs_exe_path }}

- name: Disable default VirtioFsSvc auto-mount behavior
  ansible.windows.win_service:
    name: VirtioFsSvc
    start_mode: manual
    state: stopped

- name: Register WinFSP virtiofs launcher
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      & '{{ windows_guest_tools_winfsp_fsreg_path }}' virtiofs '{{ windows_guest_tools_virtiofs_exe_path }}' '-t %1 -m %2'

- name: Render virtiofs mount script
  ansible.windows.win_copy:
    dest: "{{ windows_guest_tools_virtiofs_mount_script_path }}"
    content: |
      $ErrorActionPreference = 'Stop'
      $launchctl = '{{ windows_guest_tools_winfsp_launchctl_path }}'
      {% for share in windows_extras.host_shares %}
      & $launchctl stop virtiofs 'viofs{{ share.guest.drive[0] }}' 2>$null | Out-Null
      & $launchctl start virtiofs 'viofs{{ share.guest.drive[0] }}' '{{ share.tag }}' '{{ share.guest.drive }}'
      {% endfor %}

- name: Install boot-time scheduled task for virtiofs mounts
  community.windows.win_scheduled_task:
    name: "{{ windows_guest_tools_virtiofs_boot_task_name }}"
    description: Mount libvirt virtiofs host shares at boot
    username: SYSTEM
    run_level: highest
    enabled: true
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: >-
          -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File "{{ windows_guest_tools_virtiofs_mount_script_path }}"
    triggers:
      - type: boot
    state: present

- name: Mount virtiofs host shares now
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      & '{{ windows_guest_tools_virtiofs_mount_script_path }}'

- name: Disable default VirtioFsSvc auto-mount behavior
  ansible.windows.win_service:
    name: VirtioFsSvc
    start_mode: manual
    state: stopped
