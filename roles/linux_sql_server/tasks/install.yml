---
- name: build the SQL Server package list
  ansible.builtin.set_fact:
    linux_sql_server_packages: >-
      {{
        ['mssql-server']
        + (['mssql-server-ha'] if linux_sql_server.install_ha_agent | default(false) else [])
      }}
    linux_sql_server_tools_packages: >-
      {{
        {
          'apt': linux_sql_server_tools_packages_apt,
          'dnf': linux_sql_server_tools_packages_dnf,
          'zypper': linux_sql_server_tools_packages_zypper,
        }[ansible_pkg_mgr]
        if linux_sql_server.install_tools | default(true) else []
      }}

- name: install SQL Server packages on apt platforms
  ansible.builtin.apt:
    name: "{{ linux_sql_server_packages + linux_sql_server_tools_packages }}"
    state: present
    update_cache: true
  environment:
    ACCEPT_EULA: "Y"
  when: ansible_pkg_mgr == 'apt'

- name: install SQL Server packages on dnf platforms
  ansible.builtin.dnf:
    name: "{{ linux_sql_server_packages + linux_sql_server_tools_packages }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  when:
    - ansible_pkg_mgr == 'dnf'
    - ansible_distribution_major_version | int != 8

- name: install SQL Server packages on RHEL 8 hosts
  ansible.builtin.raw: >-
    rpm -q {{ (linux_sql_server_packages + linux_sql_server_tools_packages) | join(' ') }} >/dev/null 2>&1 &&
    echo package-state-present ||
    { ACCEPT_EULA=Y dnf install -y {{ (linux_sql_server_packages + linux_sql_server_tools_packages) | join(' ') }} &&
    echo package-state-installed; }
  register: linux_sql_server_redhat8_packages
  changed_when: "'package-state-installed' in linux_sql_server_redhat8_packages.stdout"
  when:
    - ansible_pkg_mgr == 'dnf'
    - ansible_distribution_major_version | int == 8

- name: install SQL Server packages on zypper platforms
  ansible.builtin.raw: >-
    rpm -q {{ (linux_sql_server_packages + linux_sql_server_tools_packages) | join(' ') }} >/dev/null 2>&1 &&
    echo package-state-present ||
    { ACCEPT_EULA=Y zypper --non-interactive --gpg-auto-import-keys install -y
    {{ (linux_sql_server_packages + linux_sql_server_tools_packages) | join(' ') }} &&
    echo package-state-installed; }
  register: linux_sql_server_zypper_packages
  changed_when: "'package-state-installed' in linux_sql_server_zypper_packages.stdout"
  when: ansible_pkg_mgr == 'zypper'
