---
- name: install the OpenSSH Server capability
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'

      $changed = $false
      $reboot_required = $false

      $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
      if (-not $cap) { throw "OpenSSH.Server capability not found" }

      if ($cap.State -ne 'Installed') {
        $result = Add-WindowsCapability -Online -Name $cap.Name

        $ssh = Get-WindowsCapability -Online -Name $cap.Name
        if ($ssh.State -ne 'Installed') { throw "Install failed, state=$($ssh.State)" }

        $changed = $true
        $reboot_required = [bool]$result.RestartNeeded
      }

      [pscustomobject]@{
        changed = $changed
        reboot_required = $reboot_required
        capability = $cap.Name
      } | ConvertTo-Json -Compress
  register: windows_openssh_install
  changed_when: (windows_openssh_install.output[0] | from_json).changed | default(false)

- name: reboot after the OpenSSH capability install when required
  ansible.windows.win_reboot:
  when: (windows_openssh_install.output[0] | from_json).reboot_required | default(false)

- name: ensure the sshd service startup mode is automatic
  ansible.windows.win_service:
    name: sshd
    start_mode: auto

- name: ensure the sshd service is in the desired state
  ansible.windows.win_service:
    name: sshd
    state: "{{ windows_extras.openssh.service_state }}"

- name: ensure the OpenSSH firewall rule exists
  community.windows.win_firewall_rule:
    name: OpenSSH-Server-In-TCP
    localport: "{{ windows_extras.openssh.firewall_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true

- name: set the default SSH shell
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: "{{ windows_extras.openssh.default_shell }}"
    type: string
