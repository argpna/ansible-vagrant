---
manage_firewalld: true
outbound_nat: true

networks:
  lab-main:
    cidr: 192.168.100.0/24
    forward_mode: route
    bridge_name: virbr100
    gateway: 192.168.100.1
    netmask: 255.255.255.0
    dhcp_range:
      start: 192.168.100.10
      end: 192.168.100.254

  mssql-main:
    cidr: 192.168.131.0/24
    forward_mode: route
    bridge_name: virbr131
    gateway: 192.168.131.1
    netmask: 255.255.255.0
    dhcp_range:
      start: 192.168.131.10
      end: 192.168.131.254

  mssql-dr:
    cidr: 192.168.132.0/24
    forward_mode: route
    bridge_name: virbr132
    gateway: 192.168.132.1
    netmask: 255.255.255.0
    dhcp_range:
      start: 192.168.132.10
      end: 192.168.132.254
