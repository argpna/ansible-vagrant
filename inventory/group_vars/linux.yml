ansible_connection: ssh
mssql_host_connection: ssh
ansible_user: vagrant
ansible_port: 22
ansible_ssh_private_key_file: "{{ inventory_dir }}/../.vagrant/machines/{{ inventory_hostname }}/libvirt/private_key"

controller:
  admin_user:
    name: ansible
    group: ansible-admin
    password_hash: "$6$OpPwep0n4zujElhs$gWIk6yiEIYVg9h8rcs.Nq8fgas0TSgC/3Wc.Y2SHhvtFfO74Kc63RNaZBY119UAc7kfg1MEbkCIzTod2ksedp1"
    authorized_key: "ssh-rsa "  # noqa yaml[line-length]

linux_defaults:
  provider_options:
    memory_backing: memfd
    sync_folders:
